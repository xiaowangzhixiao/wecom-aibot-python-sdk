[project]
name = "wecom-aibot-sdk"
version = "1.0.0"
description = "企业微信智能机器人 Python SDK —— 基于 WebSocket 长连接通道"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "websockets>=13.0",
    "httpx>=0.27.0",
    "cryptography>=43.0.0",
]

[project.optional-dependencies]
examples = [
    "python-dotenv>=1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wecom_aibot_sdk"]
